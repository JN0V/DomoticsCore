name: Test GitHub Installation

# Scoped to avoid running twice per branch commit — see CI-12 and the comment in
# ci.yml. The pull_request path is the one that matters here: it carries the
# head-repo/head-sha workaround below, and is what fork contributions exercise.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          pip install platformio

      - name: Create test project
        env:
          # On pull_request, GITHUB_SHA is the ephemeral refs/pull/N/merge commit.
          # It exists only as a GitHub-side ref, so PlatformIO's `git clone` +
          # `git reset --hard <sha>` cannot resolve it and every PR fails with
          # "Could not parse object". Install the PR head commit from the repo it
          # actually lives in (the fork, for external contributions) instead.
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          INSTALL_REPO="${PR_REPO:-$GITHUB_REPOSITORY}"
          INSTALL_SHA="${PR_SHA:-$GITHUB_SHA}"
          echo "Installing from https://github.com/${INSTALL_REPO}.git#${INSTALL_SHA}"

          mkdir test-install
          cd test-install
          cat > platformio.ini << EOF
          # Both declared platforms are built here, deliberately. This project
          # resolves dependencies through the root library.json — unlike the
          # in-tree examples, which list components as file:// paths and work
          # around manifest problems with lib_ignore. It is therefore the only
          # thing in CI that exercises what someone installing the library
          # actually gets, and until CI-8 the ESP8266 half of that did not work.
          [env]
          framework = arduino
          lib_deps =
              https://github.com/${INSTALL_REPO}.git#${INSTALL_SHA}
          build_unflags =
              -std=gnu++11

          [env:esp32dev]
          platform = espressif32
          board = esp32dev
          board_build.partitions = min_spiffs.csv
          build_flags =
              -std=gnu++14

          [env:esp8266dev]
          platform = espressif8266
          board = d1_mini
          build_flags =
              -std=gnu++17
          EOF

          mkdir src
          cat > src/main.cpp << 'EOF'
          #include <DomoticsCore/System.h>
          using namespace DomoticsCore;
          System* sys = nullptr;
          void setup() {
              SystemConfig config;
              config.deviceName = "Test";
              sys = new System(config);
              sys->begin();
          }
          void loop() { sys->loop(); }
          EOF

      - name: Test compilation
        run: |
          cd test-install
          pio run
