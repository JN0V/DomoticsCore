# DomoticsCore's releases: release-please keeps one pull request open with
# the next versions — the root's and each component's that changed, from the
# conventional commits — in library.json, library.properties and each
# component's metadata.version, and CHANGELOG.md (release-please-config.json).
# A person merges it, and that is the decision to release. On that merge,
# release-please tags the merged commit (vX.Y.Z for the root,
# DomoticsCore-<Component>-vX.Y.Z for a component) and writes the GitHub
# releases' notes; then release.yml publishes the root to PlatformIO.
#
# The root moves by the highest level of any change; a component only when
# its folder changed. To force a version, set `release-as` on its package in
# release-please-config.json, the reason in that commit, and remove it once
# released.
#
# It runs with the GitHub App's token (variable WORKLINE_APP_ID, secret
# WORKLINE_APP_PRIVATE_KEY), never the job's own: a pull request opened with
# GITHUB_TOKEN starts no workflow, so the release pull request would get no
# check, and workline would not judge its docs. With no App, the job fails, loud.
name: release-please
on:
  push:
    branches: [main]
permissions: {}
concurrency: {group: release-please, cancel-in-progress: false}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions: {}                 # the App's token writes, not this job's
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WORKLINE_APP_ID }}
          private-key: ${{ secrets.WORKLINE_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v5
        with: {token: "${{ steps.app.outputs.token }}"}

  release:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions: {contents: read}
    uses: ./.github/workflows/release.yml
    with: {tag: "${{ needs.release-please.outputs.tag }}"}
    secrets: inherit
