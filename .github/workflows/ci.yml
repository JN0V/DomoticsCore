name: CI

# What the other two workflows prove, and what they leave uncovered:
#   test-github-install.yml — the library installs from GitHub and compiles,
#                             for esp32dev only, from a witness project.
#   version-check.yml       — library.json versions agree with metadata.version.
#
# Neither runs a single test, and neither compiles the two other targets every
# example declares. This workflow closes both gaps.
#
# What it still does not cover, so that a green tick is not read for more than
# it is worth: a host build proves compilation, not behaviour on a board. The
# install-from-GitHub path is covered by test-github-install.yml, which since
# CI-8 builds both declared platforms rather than esp32dev alone.

# A branch commit fires push and pull_request as two separate runs, and the
# concurrency group below cannot collapse them: github.ref is refs/heads/<branch>
# for one and refs/pull/N/merge for the other, so neither cancels the other.
# Scoping push to main leaves branch commits covered exactly once, by the PR
# event, and keeps main covered after every merge (CI-12).
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The unit-test suites. Every component carries its own platformio.ini with a
  # `native` environment; there is no top-level project that runs them all, so
  # the projects are discovered rather than listed. Discovery walks the tracked
  # platformio.ini files, which finds both the eleven component projects and
  # DomoticsCore-WebUI/test/test_streaming_serializer — a native project nested
  # a level deeper that a component-level loop would have missed — and picks up
  # any project added later without editing this file.
  #
  # One job rather than a matrix: the whole set takes about ninety seconds, and
  # a single job shares one PlatformIO cache instead of twelve. Failures are
  # accumulated rather than fatal, so one broken component does not hide the
  # state of the others.
  # ---------------------------------------------------------------------------
  native-tests:
    name: Unit tests (native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-6.1.19-${{ hashFiles('DomoticsCore-*/platformio.ini', 'DomoticsCore-*/test/*/platformio.ini') }}
          restore-keys: pio-native-

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Run every native suite
        run: |
          failed=""
          found=0
          # Every component now declares a native environment, DomoticsCore-System
          # included — it was the last one without, on the grounds that
          # orchestration carries no logic of its own. It carries the decisions
          # instead: which components exist, in what order, and what happens when
          # one is absent (TEST-1). Discovery picked it up without this file
          # changing, which is the point of testing the tracked platformio.ini
          # files rather than hard-coding a list.
          for ini in $(git ls-files '*platformio.ini'); do
            grep -q '^\[env:native\]' "$ini" || continue
            project=$(dirname "$ini")
            found=$((found + 1))
            echo "::group::${project}"
            (cd "$project" && pio test -e native) || failed="${failed} ${project}"
            echo "::endgroup::"
          done
          # A discovery loop that silently matches nothing would report success
          # while running no test at all — the exact failure this job exists to
          # end. Refuse to pass on an empty run.
          if [ "$found" -eq 0 ]; then
            echo "::error::no native project found — discovery is broken"
            exit 1
          fi
          echo "ran ${found} native projects"
          if [ -n "$failed" ]; then
            echo "::error::native suites failed:${failed}"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Cross-compilation for the three targets every example declares, and that
  # library.json promises through `platforms: [espressif32, espressif8266]`.
  #
  # FullStack is the witness: of the twenty-nine examples it is the only one
  # that pulls all twelve components, so it is the only one whose esp8266dev
  # build reaches all ten ESP8266-specific headers (Platform, Filesystem,
  # HeapTracker, Wifi, WiFiServer, Storage, WebUI, MQTT, NTP, Update). Building
  # it for the three targets buys that coverage for three builds instead of
  # eighty-seven.
  #
  # Note for anyone extending this to several examples: clean_examples.py wipes
  # .pio/ from the component source directories on every build, so concurrent
  # builds sharing a checkout corrupt each other. Matrix legs run on separate
  # runners, which is why this is safe as written.
  # ---------------------------------------------------------------------------
  build-targets:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [esp32dev, esp8266dev, esp32c3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.target }}-6.1.19-${{ hashFiles('DomoticsCore-System/examples/FullStack/platformio.ini') }}
          restore-keys: pio-${{ matrix.target }}-

      # intelhex is a dependency of the esptool that espressif32 pulls in, and
      # `pip install platformio` does not bring it. Nothing here fails while a
      # warm cache still holds a working toolchain, which is exactly why it is
      # worth pinning down: the on-device job broke the first time its cache key
      # changed and it had to install espressif32 from scratch.
      - name: Install PlatformIO
        run: pip install platformio==6.1.19 intelhex

      - name: Build FullStack example
        working-directory: DomoticsCore-System/examples/FullStack
        run: pio run -e ${{ matrix.target }}

  # ---------------------------------------------------------------------------
  # The on-device suites, compiled but not run. No runner has an ESP8266 wired
  # to it, so this cannot execute them — it exists because until 2026-08-23
  # nothing built them either, and three of the four had rotted where nobody
  # could see it:
  #
  #   Storage      called StorageComponent::setNamespace(), a method that has
  #                never existed in any commit. Added 2026-01-04 with the
  #                message "build issues to fix later".
  #   WebUI        passed String to withCustomHtml(const char*) after the API
  #                split into static and Dynamic overloads.
  #   schema_memory had its suite outside test/, and an int main() where the
  #                Arduino core supplies one — it linked against nothing.
  #
  # Compiling is most of what was missing. A suite that builds can still be
  # wrong, but it cannot rot silently for seven months.
  #
  # OTA joined on 2026-08-26 with the SEC-2 re-fix, on both platforms. It is the
  # one subject here that cannot be tested any other way: SEC-2 and SEC-7 are
  # claims about what boots next, and a host build has nothing that boots. Both
  # ran before landing — 6/6 on a nodemcuv2 and 6/6 on an ESP32-CAM, each with
  # 2-3 of the 6 failing against the pre-fix code — but CI still only compiles
  # them, like the rest.
  #
  # HomeAssistant joined on 2026-08-28 with MEM-2's hot half. Its esp8266dev
  # environment was the reason this job lists its projects instead of discovering
  # them: it declared test settings, carried no ESP8266 suite and no test_filter,
  # so pio cross-compiled its native suites for the board and died on
  # Platform_Stub.h (CI-11). It now has both a suite and a filter. CI-11 stays
  # open for the coverage it actually asks for, and the list stays a list —
  # discovery over "declares esp8266dev and has a test/ directory" would still
  # match any component that acquires the same shape tomorrow, and a list that is
  # checked for existence beats a loop that silently matches the wrong thing.
  #
  # Wifi joined on 2026-08-29 with MEM-2's closing lot, and it had no board
  # environment at all before that — the project declared `[env:native]` and
  # nothing else. Its suite measures the scan-summary loop against a radio
  # seeing real networks, so this job cannot run it and would not learn much if
  # it could: the one input that makes the suite vacuous is a scan returning
  # zero networks, which is exactly what a runner in a datacentre would produce.
  # It is here so the suite cannot rot unseen, which is the whole reason this
  # job exists.
  # ---------------------------------------------------------------------------
  build-device-tests:
    name: Build on-device suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-device-tests-6.1.19-${{ hashFiles('DomoticsCore-*/platformio.ini') }}
          restore-keys: pio-device-tests-

      # See the note on the build job: espressif32's esptool needs intelhex, and
      # pip install platformio does not supply it.
      - name: Install PlatformIO
        run: pip install platformio==6.1.19 intelhex

      - name: Build every on-device suite
        run: |
          projects="
            DomoticsCore-Storage
            DomoticsCore-WebUI
            DomoticsCore-WebUI/test/test_schema_memory
            DomoticsCore-System/examples/FullStack
            DomoticsCore-OTA
            DomoticsCore-HomeAssistant
            DomoticsCore-Wifi
          "
          failed=""
          for project in $projects; do
            # A renamed or deleted project must fail loudly, not vanish from the
            # run and leave the job green with less coverage than it claims.
            if [ ! -f "$project/platformio.ini" ]; then
              echo "::error::$project has no platformio.ini — the list in this workflow is stale"
              exit 1
            fi
            echo "::group::${project}"
            (cd "$project" && pio test -e esp8266dev --without-uploading --without-testing) \
              || failed="${failed} ${project}"
            echo "::endgroup::"
          done

          # The ESP32 OTA suite is the one suite here that is not an ESP8266
          # target. It has to exist separately because the commit it observes is
          # a boot-partition switch, not an eboot command, so nothing about the
          # ESP8266 suite transfers.
          echo "::group::DomoticsCore-OTA (esp32cam)"
          (cd DomoticsCore-OTA && pio test -e esp32cam --without-uploading --without-testing) \
            || failed="${failed} DomoticsCore-OTA(esp32cam)"
          echo "::endgroup::"

          if [ -n "$failed" ]; then
            echo "::error::on-device suites failed to build:${failed}"
            exit 1
          fi
