# Publishes a release of DomoticsCore to the PlatformIO registry:
# release-please.yml calls it once it has tagged the merged release pull
# request and written the release's notes. Called in release-please's run,
# not on the tag's push. Run it by hand (Actions > Release & Publish > Run
# workflow) with the tag to publish again after a failure; a tag pushed is
# never moved.
name: Release & Publish

on:
  workflow_call:
    inputs:
      tag: {description: "the tag release-please made, v2.14.0", required: true, type: string}
  workflow_dispatch:
    inputs:
      tag: {description: "the tag to publish, v2.14.0", required: true, type: string}

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with: {ref: "refs/tags/${{ inputs.tag }}"}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Check version consistency
        env: {TAG: "${{ inputs.tag }}"}
        run: python tools/check_versions.py --verbose --check-tag --tag "$TAG"

      - name: Publish to PlatformIO Registry
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
        run: pio pkg publish --no-interactive
