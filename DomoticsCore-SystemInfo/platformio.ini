[env:native]
platform = native
test_framework = unity
test_build_src = true
lib_compat_mode = off
; SystemInfoWebUI pulls the WebUI headers (IWebUIProvider etc.); the WebUI
; symlink:// dependency declares the async server, absent on the host — ignore it.
lib_ignore = ESPAsyncWebServer, AsyncTCP, ESP Async WebServer
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -I../DomoticsCore-Core/include
    -I../DomoticsCore-SystemInfo/include
    -I../DomoticsCore-WebUI/include

lib_deps =
    symlink://../DomoticsCore-Core
    symlink://../DomoticsCore-WebUI
    bblanchon/ArduinoJson@^7.0.0
