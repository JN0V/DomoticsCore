; System is orchestration: almost everything it does is decided by
; __has_include(). The set of components listed here is therefore part of the
; test fixture, not an afterthought — it selects which branches exist at all.
;
; Listed: the four hard dependencies from library.json (Core, LED,
; RemoteConsole, Wifi), plus Storage and SystemInfo, which are what
; loadAllConfigs() and initBootDiagnosticsPersistence() need in order to do
; anything but return.
;
; Not listed: WebUI, NTP, MQTT, OTA, HomeAssistant. Their branches compile out,
; which is itself a case worth covering — a user installing System alone must
; get a system that boots, not a compile error.

[env:native]
platform = native
test_framework = unity
lib_compat_mode = off
lib_ignore = ESPAsyncWebServer, AsyncTCP, ESP Async WebServer
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -I../DomoticsCore-Core/include
    -I../DomoticsCore-LED/include
    -I../DomoticsCore-RemoteConsole/include
    -I../DomoticsCore-Wifi/include
    -I../DomoticsCore-Storage/include
    -I../DomoticsCore-SystemInfo/include
    -I../DomoticsCore-System/include

lib_deps =
    file://../DomoticsCore-Core
    file://../DomoticsCore-LED
    file://../DomoticsCore-RemoteConsole
    file://../DomoticsCore-Wifi
    file://../DomoticsCore-Storage
    file://../DomoticsCore-SystemInfo
    file://../DomoticsCore-System
    bblanchon/ArduinoJson@^7.0.0
