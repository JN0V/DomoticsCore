[platformio]
; DomoticsCore-System is not a dependency here, but the components are symlinked
; from the repository root, so libdeps sits outside every one of them.
libdeps_dir = ../../../.pio/libdeps/System-test_full_composition

; System's own native suite compiles WebUI, MQTT, NTP, OTA and HomeAssistant out
; on purpose. What a settings card writes and what the next boot reads back only
; exists when they are all present, so this project lists every component.
[env:native]
platform = native
test_framework = unity
test_build_src = false
lib_compat_mode = off
lib_ignore = PubSubClient, ESPAsyncWebServer, AsyncTCP, ESP Async WebServer
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -I../../../tests/mocks/libraries
    -I../../../DomoticsCore-Core/include
    -I../../../DomoticsCore-LED/include
    -I../../../DomoticsCore-RemoteConsole/include
    -I../../../DomoticsCore-Wifi/include
    -I../../../DomoticsCore-Storage/include
    -I../../../DomoticsCore-SystemInfo/include
    -I../../../DomoticsCore-WebUI/include
    -I../../../DomoticsCore-MQTT/include
    -I../../../DomoticsCore-NTP/include
    -I../../../DomoticsCore-OTA/include
    -I../../../DomoticsCore-HomeAssistant/include
    -I../../include

lib_deps =
    symlink://../../../DomoticsCore-Core
    symlink://../../../DomoticsCore-LED
    symlink://../../../DomoticsCore-RemoteConsole
    symlink://../../../DomoticsCore-Wifi
    symlink://../../../DomoticsCore-Storage
    symlink://../../../DomoticsCore-SystemInfo
    symlink://../../../DomoticsCore-WebUI
    symlink://../../../DomoticsCore-MQTT
    symlink://../../../DomoticsCore-NTP
    symlink://../../../DomoticsCore-OTA
    symlink://../../../DomoticsCore-HomeAssistant
    bblanchon/ArduinoJson@^7.0.0
