[env:native]
platform = native
test_framework = unity
test_build_src = true
lib_compat_mode = off
# The device suite includes <Arduino.h> and reads ESP.getCycleCount(); without
# this the required native job cross-compiles it for the host and dies on
# Platform_Stub.h (the pattern at DomoticsCore-Storage/platformio.ini:6).
test_ignore = test_wifi_scan_esp8266
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -I../DomoticsCore-Core/include
    -I../DomoticsCore-Wifi/include
    -I../DomoticsCore-WebUI/include

lib_deps =
    file://../DomoticsCore-Core
    file://../DomoticsCore-Wifi
    file://../DomoticsCore-WebUI
    bblanchon/ArduinoJson@^7.0.0

# The board environment MEM-2 needed and this project did not have. nodemcuv2,
# matching Storage, WebUI, OTA and HomeAssistant — and matching the board the
# scan measurement is written against, where String's small-string buffer is 10
# characters rather than the ESP32's 14.
[env:esp8266dev]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
# /dev/ttyUSB0 is whichever board was plugged in first, and there are three
# here. Override rather than edit: `--upload-port` / `--test-port`, with the
# adapter under /dev/serial/by-id/ as the reliable handle — the nodemcuv2 is
# FTDI_FT232R_USB_UART_A5069RR4.
upload_port = /dev/ttyUSB0
test_framework = unity
# Without this, `pio test -e esp8266dev` cross-compiles the native suites for
# the board and dies on Platform_Stub.h. The device suite is the only one this
# environment runs.
test_filter = test_wifi_scan_esp8266
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    file://../DomoticsCore-Core
    file://../DomoticsCore-Wifi
    bblanchon/ArduinoJson@^7.0.0
