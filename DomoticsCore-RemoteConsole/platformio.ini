[env:native]
platform = native
test_framework = unity
test_build_src = true
lib_compat_mode = off
# test_remoteconsole_webui compiles the provider, which reaches WebUI.h and so
# the async server the host does not have. tests/mocks/libraries supplies it
# under its real name; the real package must stay off the include path.
lib_ignore = ESPAsyncWebServer, AsyncTCP, ESP Async WebServer
# The device suite prints through the platform's own sink and includes
# <Arduino.h>; without this the required native job cross-compiles it for the host.
test_ignore = test_console_capture
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -I../tests/mocks/libraries
    -I../DomoticsCore-Core/include
    -I../DomoticsCore-Wifi/include
    -I../DomoticsCore-RemoteConsole/include
    -I../DomoticsCore-WebUI/include

lib_deps =
    symlink://../DomoticsCore-Core
    symlink://../DomoticsCore-Wifi
    symlink://../DomoticsCore-WebUI
    bblanchon/ArduinoJson@^7.0.0

# The two platform halves of the core-log capture reach every target through
# Logger.h, so the required checks build them; only a board runs the sink they
# install. One suite, both platforms, and it joins no network — a console starts
# its server before WiFi is up.
[env:esp8266dev]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
# /dev/ttyUSB0 is whichever board was plugged in first: override with
# --upload-port / --test-port rather than editing this.
upload_port = /dev/ttyUSB0
test_framework = unity
test_build_src = true
test_filter = test_console_capture
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    symlink://../DomoticsCore-Core
    symlink://../DomoticsCore-Wifi
    bblanchon/ArduinoJson@^7.0.0

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
test_framework = unity
test_build_src = true
test_filter = test_console_capture
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    symlink://../DomoticsCore-Core
    symlink://../DomoticsCore-Wifi
    bblanchon/ArduinoJson@^7.0.0
