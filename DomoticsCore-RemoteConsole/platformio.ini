[env:native]
platform = native
test_framework = unity
test_build_src = true
lib_compat_mode = off
# test_remoteconsole_webui compiles the provider, which reaches WebUI.h and so
# the async server the host does not have. tests/mocks/libraries supplies it
# under its real name; the real package must stay off the include path.
lib_ignore = ESPAsyncWebServer, AsyncTCP, ESP Async WebServer
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -I../tests/mocks/libraries
    -I../DomoticsCore-Core/include
    -I../DomoticsCore-Wifi/include
    -I../DomoticsCore-RemoteConsole/include
    -I../DomoticsCore-WebUI/include

lib_deps =
    symlink://../DomoticsCore-Core
    symlink://../DomoticsCore-Wifi
    symlink://../DomoticsCore-WebUI
    bblanchon/ArduinoJson@^7.0.0
