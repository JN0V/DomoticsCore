[env:native]
platform = native
test_framework = unity
test_build_src = true
lib_compat_mode = off
test_ignore =
    test_ota_esp8266
    test_ota_esp32
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -I../DomoticsCore-Core/include
    -I../DomoticsCore-OTA/include

lib_deps =
    file://../DomoticsCore-Core
    file://../DomoticsCore-OTA
    bblanchon/ArduinoJson@^7.0.0

# The ESP32 half of SEC-2 was argued from the vendored Updater.cpp and never run
# on a board. Here the commit is a boot-partition switch rather than an eboot
# command, so it needs its own suite. esp32cam is simply the ESP32 that was to
# hand; any board with two OTA slots will do — the stock default.csv has them.
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
test_framework = unity
test_filter = test_ota_esp32
# Not optional. This board defaults to a single 3 MB app slot, and OTA has
# nowhere to write: esp_ota_get_next_update_partition() then returns the
# *running* partition rather than null, Update erases the code it is executing
# from, and ESP-IDF aborts inside spi_flash with no message. default.csv gives
# the two 1.25 MB slots OTA actually requires.
board_build.partitions = default.csv
# Without the unflag the platform's own -std=gnu++11 wins and Update_ESP32.h's
# inline variables compile only as a GNU extension, with a warning saying so.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    file://../DomoticsCore-Core
    file://../DomoticsCore-OTA
    bblanchon/ArduinoJson@^7.0.0

# SEC-2 is a claim about flash, and only a board can settle it. The host suite
# counts calls into a stub; this one reads back the eboot command that decides
# what boots next. See test_ota_esp8266/ for what it arms and why.
[env:esp8266dev]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
test_framework = unity
test_filter = test_ota_esp8266
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    file://../DomoticsCore-Core
    file://../DomoticsCore-OTA
    bblanchon/ArduinoJson@^7.0.0
