[env:native]
platform = native
test_framework = unity
test_build_src = true
lib_compat_mode = off
test_ignore = test_ota_esp8266
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -I../DomoticsCore-Core/include
    -I../DomoticsCore-OTA/include

lib_deps =
    file://../DomoticsCore-Core
    file://../DomoticsCore-OTA
    bblanchon/ArduinoJson@^7.0.0

# SEC-2 is a claim about flash, and only a board can settle it. The host suite
# counts calls into a stub; this one reads back the eboot command that decides
# what boots next. See test_ota_esp8266/ for what it arms and why.
[env:esp8266dev]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
test_framework = unity
test_filter = test_ota_esp8266
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    file://../DomoticsCore-Core
    file://../DomoticsCore-OTA
    bblanchon/ArduinoJson@^7.0.0
