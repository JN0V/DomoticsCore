[platformio]
; DomoticsCore-Core is a symlink:// dependency and it CONTAINS this project, so
; libdeps has to sit outside it or the component claims every include under it
; own libdeps.
libdeps_dir = ../../../.pio/libdeps/Core-test_queue_budget_override

; -DDOMOTICS_EVENTBUS_QUEUE_BYTES is a compile-time budget, so proving it
; is honoured needs a translation unit built with it — which the component's own
; native environment, built without it, cannot be. Hence a project of its own:
; one environment, one flag, and the suite reads the flag back out of QueueCost.
[env:native]
platform = native
test_framework = unity
; glibc's tcache keeps freed blocks counted as allocated by mallinfo(), which
; HeapTracker reads: without this a heap assertion depends on the tests before it.
test_testing_command =
    env
    GLIBC_TUNABLES=glibc.malloc.tcache_count=0
    ${platformio.build_dir}/${this.__env__}/program
test_build_src = false
lib_compat_mode = off
lib_deps =
    symlink://../../
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DDOMOTICS_EVENTBUS_QUEUE_BYTES=2048
    -I../../include
