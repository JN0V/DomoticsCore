[env:native]
platform = native
test_framework = unity
test_build_src = true
; test/test_queue_budget_override is a project of its own, built with
; -DDOMOTICS_EVENTBUS_QUEUE_BYTES; run from here it would compile without the
; flag and fail its own static_assert.
test_ignore = test_queue_budget_override
build_flags = 
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
