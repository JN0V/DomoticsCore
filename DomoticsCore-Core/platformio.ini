[env:native]
platform = native
test_framework = unity
; glibc's tcache keeps freed blocks counted as allocated by mallinfo(), which
; HeapTracker reads: without this a heap assertion depends on the tests before it.
test_testing_command =
    env
    GLIBC_TUNABLES=glibc.malloc.tcache_count=0
    ${platformio.build_dir}/${this.__env__}/program
test_build_src = true
; test/test_queue_budget_override is a project of its own, built with
; -DDOMOTICS_EVENTBUS_QUEUE_BYTES; run from here it would compile without the
; flag and fail its own static_assert.
test_ignore = test_queue_budget_override
build_flags = 
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
