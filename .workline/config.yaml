roles:
  committer:
    settings:
      # The role's list (a project's list replaces it), plus the chips this
      # library targets: ESP32 and ESP8266 are names, not internal codes.
      internal-codes-allow: [UTF-8, UTF-16, UTF8, UTF16, SHA-1, SHA-256, SHA-512, SHA1, SHA256, SHA512, ISO-8601, 'RFC-[0-9]+', 'CVE-[0-9]+',
        'IPv[46]', x86, x64, arm64, amd64, win32, win64, 'H26[45]', 'MP[34]', 'HTTP[23]', OAuth2, 'ES20[0-9]{2}', 'v[0-9]+', 'Go1[0-9]+',
        'ESP32', 'ESP8266']
  documentalist:
    settings:
      # Catching up a backlog of docs, nightly: few pull requests waiting at a
      # time, few docs per call, so the subscription's limits hold.
      max-open-merge-requests: 3
      ai-max-calls: 5
      # Docs whose sources do not fit one call are judged in parts, a share
      # of their sources at a time (workline ADR-0009; the default since
      # workline v0.28.0): fixed, but `checked` stays for a person, who reads
      # them whole. One doc in parts a night: at most 8 parts.
      parts-max-per-run: 8
      # A safety net on the tokens a night spends, all calls together. Past
      # it the rest waits; a doc whose parts it cuts is asked again later.
      ai-max-tokens: 400000
      # The weekly sample (workline ADR-0015): the gardening vouches with
      # Sonnet, so Opus reads. Nothing vouched for before the merge of #119,
      # the first engine on main that earns `checked` (v0.2.1), is sampled.
      sample: {judge: "claude:opus", after: ab2876ae9f5c20fa1128aae15e16f36c1bc3d118}
  product-owner:
    settings:
      # A draft or a question waits the default 24 h. The line runs on a
      # host, never on a board: an issue whose Validation needs hardware (a
      # chip, a radio, a sensor, a flash) is not one to move to ready; the
      # owner keeps it off the line, with no workline label.
      acts: {split: {mode: act}, effort: {mode: act}}
  tester:
    settings:
      # Each component is a PlatformIO project with native Unity suites in
      # test/test_*/, built and run on the host by g++; no board, no
      # hardware. tools/workline-tests.sh runs them and merges their
      # reports, its classname <component>/<suite>, its files from the root.
      test-command: tools/workline-tests.sh {report}
      # This project's headers run long lines: 1500 lines of them passed
      # the role's token budget for one call.
      code-lines-max: 1000
      # A new test is a new suite folder: a suite is one program, so a
      # second file beside an existing one would define main() twice.
      test-paths: ["DomoticsCore-*/test/**", "DomoticsCore-WebUI/webui_test/**"]
      # g++'s error lines, rewritten from the root by the script: a test
      # written before its code names what the code lacks.
      build-errors:
        - error: '^(?P<file>[^\s:]+\.(?:cpp|cc|c|h|hpp)):\d+:\d+: error: (?P<message>.+)$'
          missing-name:
            # gcc quotes with ‘’ in a UTF-8 locale, with '' in C.
            - "^[‘'][\\w:]+[’'] was not declared in this scope"
            - "^[‘'][\\w:]+[’'] has not been declared"
            - "^[‘'][\\w:]+[’'] is not a member of [‘'][\\w:]+[’']"
            # A const object's member reads ‘const struct …’.
            - "^[‘'](?:const )?(?:class|struct) [^’']+[’'] has no member named [‘']\\w+[’']"
          test-name: '(?m)^(?:static\s+)?void\s+(test_\w+)\s*\(\s*(?:void)?\s*\)'
  developer:
    settings:
      # Its proof on the components its code and the tests touch, native
      # suites only; the pull request's CI runs every suite and every
      # board build.
      proof-command: tools/workline-tests.sh {report} {packages}
  reviewer:
    settings:
      # A verified important finding of these lenses holds the merge: the
      # owner was finding them after the line had them and let them pass.
      # The other lenses warn.
      ai-findings: {correctness: block, intent: block, tests: block}
      # Lines of the files changed a lens reads whole (600 shipped): this
      # project's headers run long, and misses sat outside the hunks.
      code-lines-max: 3000
      # The shipped lenses, then this project's own: heap, String, flash,
      # stack, ESP8266 against ESP32, blocking calls in loop()
      # (.workline/roles/reviewer/prompts/lenses/embedded.md). It warns.
      lenses: [correctness, edge-cases, tests, intent, claims, simplicity, comments, embedded]

routing:
  # Before a push, the committer checks the commits leaving the machine; the
  # documentalist only counts the docs they made suspect. On a pull
  # request, the committer and the documentalist, the tester's guard on its
  # own branches, then the reviewer reads the code. Gardening at night: the
  # docs, then the backlog, then the specs it refined. On an issue's label
  # (workline-develop.yml): to refine wakes the product owner, then the
  # reviewer reads its spec; waiting for its tests wakes the tester; ready
  # wakes the developer.
  events: {pre-push: [committer, documentalist], merge-request: [committer, documentalist, tester, reviewer],
    schedule: [documentalist, product-owner, reviewer], issue: [product-owner, reviewer, tester, developer]}
  # Ready holds 10 issues at most (5 shipped): the owner raised it, 11 were waiting for room.
  wip: {ready: 10}
  # Steps the reconciler starts per run: the owner raised it with wip, 3 shipped.
  reconcile-max: 10

# Cautious: the forge merges only what the owner accepted with the
# label workline:accepted; nothing merges alone.
merge: {autonomy: cautious}
