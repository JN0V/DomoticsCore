[env:native]
platform = native
test_framework = unity
lib_compat_mode = off
; test_led_webui builds LEDWebUI, which reaches the WebUI headers. The async
; server is never linked on the host — IWebUIProvider resolves to WebUI_Stub.h.
lib_ignore = ESPAsyncWebServer, AsyncTCP, ESP Async WebServer
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -I../DomoticsCore-Core/include
    -I../DomoticsCore-LED/include
    -I../DomoticsCore-WebUI/include

lib_deps =
    file://../DomoticsCore-Core
    file://../DomoticsCore-LED
    file://../DomoticsCore-WebUI
    bblanchon/ArduinoJson@^7.0.0
