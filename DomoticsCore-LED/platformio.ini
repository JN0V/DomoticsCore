[env:native]
platform = native
test_framework = unity
; glibc's tcache keeps freed blocks counted as allocated by mallinfo(), which
; HeapTracker reads: without this a heap assertion depends on the tests before it.
test_testing_command =
    env
    GLIBC_TUNABLES=glibc.malloc.tcache_count=0
    ${platformio.build_dir}/${this.__env__}/program
lib_compat_mode = off
; test_led_webui builds LEDWebUI, which reaches the WebUI headers. The async
; server is never linked on the host — IWebUIProvider resolves to WebUI_Stub.h.
lib_ignore = ESPAsyncWebServer, AsyncTCP, ESP Async WebServer
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -I../DomoticsCore-Core/include
    -I../DomoticsCore-LED/include
    -I../DomoticsCore-WebUI/include

lib_deps =
    symlink://../DomoticsCore-Core
    symlink://../DomoticsCore-WebUI
    bblanchon/ArduinoJson@^7.0.0
