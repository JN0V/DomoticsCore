[env:native]
platform = native
test_framework = unity
test_build_src = true
lib_compat_mode = off
lib_ignore = PubSubClient
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -I../DomoticsCore-Core/include
    -I../DomoticsCore-Wifi/include
    -I../DomoticsCore-MQTT/include
    -I../DomoticsCore-HomeAssistant/include
extra_scripts = pre:../clean_examples.py
lib_deps =
    file://../DomoticsCore-Core
    file://../DomoticsCore-Wifi
    file://../DomoticsCore-MQTT
    file://../DomoticsCore-HomeAssistant
    bblanchon/ArduinoJson@^7.0.0

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
test_framework = unity
test_build_src = true
lib_compat_mode = off
monitor_speed = 115200
build_flags =
    -std=gnu++14
    -Wall
    -DCORE_DEBUG_LEVEL=3
build_unflags = -std=gnu++11
lib_deps =
    file://../DomoticsCore-Core
    file://../DomoticsCore-Wifi
    file://../DomoticsCore-MQTT
    file://../DomoticsCore-HomeAssistant
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
extra_scripts = pre:../clean_examples.py

[env:esp8266dev]
platform = espressif8266
board = d1_mini
framework = arduino
test_framework = unity
test_build_src = true
lib_compat_mode = off
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    file://../DomoticsCore-Core
    file://../DomoticsCore-Wifi
    file://../DomoticsCore-MQTT
    file://../DomoticsCore-HomeAssistant
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
extra_scripts = pre:../clean_examples.py
