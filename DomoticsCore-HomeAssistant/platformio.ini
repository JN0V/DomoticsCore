[env:native]
platform = native
test_framework = unity
test_build_src = true
lib_compat_mode = off
# test_ha_webui builds HomeAssistantWebUI, which reaches the WebUI headers.
# DomoticsCore-WebUI declares the async server, which is never linked on the host
# — IWebUIProvider resolves to WebUI_Stub.h (DomoticsCore-LED/platformio.ini:7).
lib_ignore = PubSubClient, ESPAsyncWebServer, AsyncTCP, ESP Async WebServer
# The device suite includes <Arduino.h> and reads ESP.getFreeHeap(); without
# this the required native job cross-compiles it for the host (the pattern at
# DomoticsCore-Storage/platformio.ini:6).
test_ignore = test_ha_heap_esp8266
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -I../DomoticsCore-Core/include
    -I../DomoticsCore-Wifi/include
    -I../DomoticsCore-MQTT/include
    -I../DomoticsCore-HomeAssistant/include
    -I../DomoticsCore-WebUI/include
extra_scripts = pre:../clean_examples.py
lib_deps =
    file://../DomoticsCore-Core
    file://../DomoticsCore-Wifi
    file://../DomoticsCore-MQTT
    file://../DomoticsCore-HomeAssistant
    file://../DomoticsCore-WebUI
    bblanchon/ArduinoJson@^7.0.0

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
test_framework = unity
test_build_src = true
lib_compat_mode = off
monitor_speed = 115200
# ESP8266-only: the suite is written against umm_malloc's figures on a
# nodemcuv2. ESP32 is compile-only for MEM-2, through the native suites and the
# FullStack build.
# test_ha_webui reaches the WebUI headers, which this environment does not
# depend on; the provider is compiled for all three targets by the FullStack
# example, through SystemWebUISetup.h:377.
test_ignore = test_ha_heap_esp8266, test_ha_webui
build_flags =
    -std=gnu++14
    -Wall
    -DCORE_DEBUG_LEVEL=3
build_unflags = -std=gnu++11
lib_deps =
    file://../DomoticsCore-Core
    file://../DomoticsCore-Wifi
    file://../DomoticsCore-MQTT
    file://../DomoticsCore-HomeAssistant
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
extra_scripts = pre:../clean_examples.py

[env:esp8266dev]
platform = espressif8266
# nodemcuv2, matching Storage, WebUI and OTA — and matching what the device
# suite, the roadmap and the suite's own free-heap ceiling all describe. It said
# d1_mini while nothing in this environment was ever built, which would have had
# whoever runs the owed board test flash a d1_mini image and report it as the
# nodemcuv2 run.
board = nodemcuv2
framework = arduino
test_framework = unity
test_build_src = true
lib_compat_mode = off
monitor_speed = 115200
# /dev/ttyUSB0 is whichever board was plugged in first, and there are three here.
# Override rather than edit: `--upload-port` / `--test-port`, with the adapter
# under /dev/serial/by-id/ as the reliable handle.
upload_port = /dev/ttyUSB0
# Without this, `pio test -e esp8266dev` cross-compiles the native suites for
# the board and dies on Platform_Stub.h — the state CI-11 recorded. The device
# suite is the only one this environment runs.
test_filter = test_ha_heap_esp8266
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    file://../DomoticsCore-Core
    file://../DomoticsCore-Wifi
    file://../DomoticsCore-MQTT
    file://../DomoticsCore-HomeAssistant
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
extra_scripts = pre:../clean_examples.py
