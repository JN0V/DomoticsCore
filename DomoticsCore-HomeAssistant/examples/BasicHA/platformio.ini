[platformio]
; The components are symlink:// dependencies, built where they live. libdeps
; stays outside the component this project sits in, or that component claims
; every include under it (CI-15).
libdeps_dir = ../../../.pio/libdeps/HomeAssistant-BasicHA

[env]
framework = arduino
lib_deps =
    symlink://../../../DomoticsCore-Core
    symlink://../../../DomoticsCore-Wifi
    symlink://../../../DomoticsCore-MQTT
    symlink://../../../DomoticsCore-HomeAssistant
lib_archive = false
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=3

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags = ${env.build_flags} -std=gnu++14
build_unflags = -std=gnu++11
monitor_filters = esp32_exception_decoder

[env:esp8266dev]
platform = espressif8266
board = d1_mini
build_flags = ${env.build_flags} -std=gnu++17

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags = 
    ${env.build_flags} -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
