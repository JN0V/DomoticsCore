; Board probe: which core log lines a vprintf hook can actually see.
;
; The remote console carries what DLOG_* emits. The question this answers, before
; any component code is written, is what a single mechanism would add: ESP-IDF's
; own lines go through esp_log_write and reach esp_log_set_vprintf, while the
; Arduino core's log_e/log_i go through log_printf -> ets_printf and do not.
;
;   pio run -e esp32dev -t upload --upload-port /dev/ttyUSB0
;   uv run --with pyserial tools/on-device/readserial.py /dev/ttyUSB0 --for 20
[env:esp32dev]
build_src_filter = +<main.cpp>
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
build_flags = -std=gnu++14 -DCORE_DEBUG_LEVEL=5
build_unflags = -std=gnu++11

[env:nodemcuv2]
build_src_filter = +<main8266.cpp>
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB1
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=5
build_unflags = -std=gnu++11
