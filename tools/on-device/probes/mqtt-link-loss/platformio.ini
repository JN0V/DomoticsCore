; Board probe: what a device sees when its broker link goes away. A System with
; MQTT and HomeAssistant joined to the LAN from the repository's secrets.h,
; printing one line per mqtt/connected and mqtt/disconnected as the bus
; delivers them, with the MQTT state and HomeAssistant::isReady() beside them.
; Restart the broker under it, or pull its power.
;
; The broker must be one you can restart, so it is named separately from the
; DC_MQTT_BROKER every example on the ladder reads:
;   PLATFORMIO_BUILD_FLAGS='-DDC_LINK_LOSS_BROKER=\"192.168.1.20\"'
[env]
framework = arduino
lib_archive = false
lib_ldf_mode = chain
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=3 -I../../../..
lib_deps =
    symlink://../../../../DomoticsCore-Core
    symlink://../../../../DomoticsCore-LED
    symlink://../../../../DomoticsCore-RemoteConsole
    symlink://../../../../DomoticsCore-Wifi
    symlink://../../../../DomoticsCore-System
    symlink://../../../../DomoticsCore-MQTT
    symlink://../../../../DomoticsCore-HomeAssistant
    bblanchon/ArduinoJson@^7.0.4
    knolleary/PubSubClient@^2.8

; /dev/ttyUSB0 is whichever board was plugged in first, and there are three
; here: override with --upload-port rather than editing this line.
[env:esp32dev]
platform = espressif32
board = esp32dev
upload_port = /dev/ttyUSB0
build_flags = ${env.build_flags} -std=gnu++14
build_unflags = -std=gnu++11
