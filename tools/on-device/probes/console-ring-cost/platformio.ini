; Board probe: what one captured log line costs in the console's ring.
;
; The ring holds LogEntry, which carries two Arduino Strings, so a line longer
; than the small-string threshold takes a heap block of its own. The decision the
; ring size needs is denominated in bytes per line, per platform, measured rather
; than derived from sizeof alone.
;
;   pio run -e esp32dev   -t upload --upload-port /dev/ttyUSB0
;   pio run -e nodemcuv2  -t upload --upload-port /dev/ttyUSB1
[env]
framework = arduino
lib_archive = false
lib_ldf_mode = chain
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=3 -I../../../..
lib_deps =
    symlink://../../../../DomoticsCore-Core
    symlink://../../../../DomoticsCore-Wifi
    symlink://../../../../DomoticsCore-RemoteConsole

[env:esp32dev]
platform = espressif32
board = esp32dev
upload_port = /dev/ttyUSB0
build_flags = ${env.build_flags} -std=gnu++14
build_unflags = -std=gnu++11

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
upload_port = /dev/ttyUSB1
build_flags = ${env.build_flags} -std=gnu++17
build_unflags = -std=gnu++11
