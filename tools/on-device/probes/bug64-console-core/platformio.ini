; Board probe: the platform's own log lines, read over the remote console.
;
; ESP32 provokes one line of each shape — an ESP-IDF library line through the
; vprintf hook, an Arduino core line through the character sink — every few
; seconds. ESP8266 runs a scan instead, which is what makes its SDK narrate.
;
; The red run is public API: PROBE_RELEASE_CAPTURE=1 calls removeCapture() right
; after begin(), which is the state before this capture existed.
;
;   pio run -e esp32dev  -t upload --upload-port /dev/ttyUSB0
;   pio run -e nodemcuv2 -t upload --upload-port /dev/ttyUSB1
;   uv run tools/on-device/console_watch.py <device-ip> --for 30 --count PLATFORM
[env]
framework = arduino
lib_archive = false
lib_ldf_mode = chain
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=5 -I../../../..
lib_deps =
    symlink://../../../../DomoticsCore-Core
    symlink://../../../../DomoticsCore-LED
    symlink://../../../../DomoticsCore-RemoteConsole
    symlink://../../../../DomoticsCore-Wifi
    symlink://../../../../DomoticsCore-System

[env:esp32dev]
build_src_filter = +<main_esp32.cpp>
platform = espressif32
board = esp32dev
upload_port = /dev/ttyUSB0
build_flags = ${env.build_flags} -std=gnu++14
build_unflags = -std=gnu++11

[env:nodemcuv2]
build_src_filter = +<main_esp8266.cpp>
platform = espressif8266
board = nodemcuv2
upload_port = /dev/ttyUSB1
build_flags = ${env.build_flags} -std=gnu++17
build_unflags = -std=gnu++11
