; Board probe: an async WiFi scan started with no configured SSID — the state an
; operator provisions from, and the one the native stub cannot speak for. Prints
; the number of entries and the summary's length, never the summary itself: the
; neighbours' network names are nobody's business.
;
; Flash and read the port; there is no test runner here.
;   pio run -e nodemcuv2 -t upload --upload-port /dev/serial/by-id/<fragment>
[env]
framework = arduino
lib_archive = false
lib_ldf_mode = chain
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=3
lib_deps =
    symlink://../../../../DomoticsCore-Core
    symlink://../../../../DomoticsCore-Wifi

; /dev/ttyUSB0 is whichever board was plugged in first, and there are three
; here: override with --upload-port rather than editing this line.
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
upload_port = /dev/ttyUSB0
build_flags = ${env.build_flags} -std=gnu++17
build_unflags = -std=gnu++11

[env:esp32dev]
platform = espressif32
board = esp32dev
upload_port = /dev/ttyUSB0
build_flags = ${env.build_flags} -std=gnu++14
build_unflags = -std=gnu++11
