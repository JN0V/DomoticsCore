; The EventBus with two tasks inside it: a publisher pinned to core 0 at the
; async web server's priority, and poll() on the application core. That is the
; shape of every WebUI settings write on an ESP32 — the handler runs on
; `async_tcp`, `Core::loop()` drains on `loopTask` — reduced to the two calls
; that meet.
;
; Core alone: no radio, no storage, nothing else that could be blamed. Without
; the bus lock the probe panics inside the queue within seconds; with it, it
; runs until the serial reader gives up.
;
; ESP32 only. The ESP8266 has no second task to race against: its SDK callbacks
; run in the application context.
[env]
framework = arduino
lib_archive = false
lib_ldf_mode = chain
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=3
lib_deps =
    symlink://../../../../DomoticsCore-Core

[env:esp32dev]
platform = espressif32
board = esp32dev
upload_port = /dev/ttyUSB0
build_flags = ${env.build_flags} -std=gnu++14
build_unflags = -std=gnu++11

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
upload_port = /dev/ttyACM0
build_flags = ${env.build_flags} -std=gnu++14 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
