; OBS Lot B board probe: a System with console, Storage and SystemInfo joined
; to the LAN from the repository's secrets.h, the crash commands compiled in,
; and a stopwatch around System::loop(). Build with and without
; -DDOMOTICS_FLIGHT_RECORDER_TICK=0 (PLATFORMIO_BUILD_FLAGS) for the
; sampler's cost; drive `crash <kind>` with tools/on-device/console_cmd.py.
; The nodemcuv2 needs this rather than FullStack, which never joins a
; network on an ESP8266 (CI-14).
[env]
framework = arduino
lib_archive = false
lib_ldf_mode = chain
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=3 -I../../../.. -DDOMOTICS_ENABLE_CRASH_COMMANDS=1
extra_scripts = pre:../../../../clean_examples.py
lib_deps =
    file://../../../../DomoticsCore-Core
    file://../../../../DomoticsCore-LED
    file://../../../../DomoticsCore-RemoteConsole
    file://../../../../DomoticsCore-Wifi
    file://../../../../DomoticsCore-System
    file://../../../../DomoticsCore-Storage
    file://../../../../DomoticsCore-SystemInfo
    bblanchon/ArduinoJson@^7.0.4

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
board_build.filesystem = littlefs
upload_port = /dev/ttyUSB1
build_flags = ${env.build_flags} -std=gnu++17
build_unflags = -std=gnu++11

[env:esp32dev]
platform = espressif32
board = esp32dev
upload_port = /dev/ttyUSB0
build_flags = ${env.build_flags} -std=gnu++14
build_unflags = -std=gnu++11
