; BUG-41 board probe: calibrates the four QueueCost constants (kNode, kOverhead,
; kMinBlock, kSsoChars) one at a time. Core alone — no radio, no storage: every
; byte the heap moves must be the queue's. Series and method in
; spec-bug-41-eventbus-queue-bounded-by-bytes.md §7.
[env]
framework = arduino
lib_archive = false
lib_ldf_mode = chain
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=3
lib_deps =
    symlink://../../../../DomoticsCore-Core

[env:esp32dev]
platform = espressif32
board = esp32dev
upload_port = /dev/ttyUSB0
build_flags = ${env.build_flags} -std=gnu++14
build_unflags = -std=gnu++11

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
board_build.filesystem = littlefs
upload_port = /dev/ttyUSB1
build_flags = ${env.build_flags} -std=gnu++17
build_unflags = -std=gnu++11
