; Board probe: calibrates the three QueueCost constants (kNode,
; kOverhead, kSsoChars) one at a time. Core alone — no radio, no storage: every
; byte the heap moves must be the queue's. One series per constant; each series
; prints a staircase whose slope is the per-event cost.
[env]
framework = arduino
lib_archive = false
lib_ldf_mode = chain
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=3
lib_deps =
    symlink://../../../../DomoticsCore-Core

[env:esp32dev]
platform = espressif32
board = esp32dev
upload_port = /dev/ttyUSB0
build_flags = ${env.build_flags} -std=gnu++14
build_unflags = -std=gnu++11

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
board_build.filesystem = littlefs
upload_port = /dev/ttyUSB1
build_flags = ${env.build_flags} -std=gnu++17
build_unflags = -std=gnu++11

; The C3 is the reason this environment exists: DOMOTICS_PLATFORM_ESP32 covers
; it, so it took the xtensa ESP32's measured constants while no board had ever
; measured it. It is on the conservative set until this series says otherwise.
; Native USB-Serial-JTAG, so the port is the chip and it disappears on reset —
; read it with tools/on-device/read_acm.py, not with a single open.
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
upload_port = /dev/ttyACM0
build_flags = ${env.build_flags} -std=gnu++14 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
