; Board probe: an MQTT session over TLS, verified against a CA the firmware
; carries. A System with MQTT and NTP joined to the LAN from the repository's
; secrets.h; every 5 s one TLS line with the session state and the last error.
;
; The CA comes from a header outside the tree, named on the build line:
;   PLATFORMIO_BUILD_FLAGS='-I/path/to/dir -DDC_TLS_BROKER=\"192.168.1.20\"'
; where /path/to/dir/mqtt_tls_ca.h defines DC_TLS_CA_PEM. Without the header,
; the probe runs TLS with no CA, which must be refused.
[env]
framework = arduino
lib_archive = false
lib_ldf_mode = chain
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=3 -I../../../..
lib_deps =
    symlink://../../../../DomoticsCore-Core
    symlink://../../../../DomoticsCore-LED
    symlink://../../../../DomoticsCore-RemoteConsole
    symlink://../../../../DomoticsCore-Wifi
    symlink://../../../../DomoticsCore-System
    symlink://../../../../DomoticsCore-MQTT
    symlink://../../../../DomoticsCore-NTP
    bblanchon/ArduinoJson@^7.0.4
    knolleary/PubSubClient@^2.8

; /dev/ttyUSB0 is whichever board was plugged in first: override with
; --upload-port rather than editing this line.
[env:esp32dev]
platform = espressif32
board = esp32dev
upload_port = /dev/ttyUSB0
build_flags = ${env.build_flags} -std=gnu++14
build_unflags = -std=gnu++11

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
upload_port = /dev/ttyUSB0
build_flags = ${env.build_flags} -std=gnu++17
build_unflags = -std=gnu++11
