; Board probe: what Home Assistant reads back after the broker was away.
;
; An event-driven entity — one that publishes on change and on nothing else —
; is the exposure. The probe seeds a retained value while the link is up,
; publishes exactly one new value while the broker is down, and then stops. Read
; the retained state topic after the reconnection: it carries the seed if the
; outage's value was lost, and the new value if it was held.
;
;   docker stop bench-mosquitto     (or whatever restarts yours)
;   ... wait for REPUB outage-published ...
;   docker start bench-mosquitto
;   uv run tools/on-device/mqtt_watch.py <broker> --for 5 \
;        --topic 'homeassistant/binary_sensor/+/door/state'
;
; The broker has to be one you can restart, so it is named separately from the
; DC_MQTT_BROKER every example on the ladder reads:
;   PLATFORMIO_BUILD_FLAGS='-DDC_REPUB_BROKER=\"192.168.1.20\"'
[env]
framework = arduino
lib_archive = false
lib_ldf_mode = chain
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=3 -I../../../..
lib_deps =
    symlink://../../../../DomoticsCore-Core
    symlink://../../../../DomoticsCore-LED
    symlink://../../../../DomoticsCore-RemoteConsole
    symlink://../../../../DomoticsCore-Wifi
    symlink://../../../../DomoticsCore-System
    symlink://../../../../DomoticsCore-MQTT
    symlink://../../../../DomoticsCore-HomeAssistant
    bblanchon/ArduinoJson@^7.0.4
    knolleary/PubSubClient@^2.8

; /dev/ttyUSB0 is whichever board was plugged in first, and there are three
; here: override with --upload-port rather than editing this line.
[env:esp32dev]
platform = espressif32
board = esp32dev
upload_port = /dev/ttyUSB0
build_flags = ${env.build_flags} -std=gnu++14
build_unflags = -std=gnu++11

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
upload_port = /dev/ttyUSB1
build_flags = ${env.build_flags} -std=gnu++17
build_unflags = -std=gnu++11
