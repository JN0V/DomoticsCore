; Board probe: how long loop() and MQTTComponent::publish() take while the
; broker link is slow or lossy. A System with MQTT and HomeAssistant joined to
; the LAN from the repository's secrets.h; every 2 s a burst of small publishes,
; every 10 s one STALL line with the worst loop() and publish() of the window.
; Every loop() over 100 ms is printed as it happens.
;
; Point it at a broker behind tc netem, named on the build line:
;   PLATFORMIO_BUILD_FLAGS='-DDC_STALL_BROKER=\"192.168.1.20\" -DDC_STALL_PORT=1884'
[env]
framework = arduino
lib_archive = false
lib_ldf_mode = chain
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=3 -I../../../..
lib_deps =
    symlink://../../../../DomoticsCore-Core
    symlink://../../../../DomoticsCore-LED
    symlink://../../../../DomoticsCore-RemoteConsole
    symlink://../../../../DomoticsCore-Wifi
    symlink://../../../../DomoticsCore-System
    symlink://../../../../DomoticsCore-MQTT
    symlink://../../../../DomoticsCore-HomeAssistant
    bblanchon/ArduinoJson@^7.0.4
    knolleary/PubSubClient@^2.8

; /dev/ttyUSB0 is whichever board was plugged in first: override with
; --upload-port rather than editing this line.
[env:esp32dev]
platform = espressif32
board = esp32dev
upload_port = /dev/ttyUSB0
build_flags = ${env.build_flags} -std=gnu++14
build_unflags = -std=gnu++11

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
upload_port = /dev/ttyUSB0
build_flags = ${env.build_flags} -std=gnu++17
build_unflags = -std=gnu++11
