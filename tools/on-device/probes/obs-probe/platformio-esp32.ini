[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
build_flags = -DCORE_DEBUG_LEVEL=3 -DSTART_STEP=2

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
build_flags = -DCORE_DEBUG_LEVEL=3 -DSTART_STEP=0 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
