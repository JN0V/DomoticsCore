; Board probe: the WebUI's update buffer shared by the poll handler (async web
; task) and the SSE broadcast (loop task). A provider whose 24 fields change on
; every build, and an SSE interval of zero, so loop() rebuilds the buffer as
; often as it can while a client polls /api/ui/updates.
;
; Joins the LAN from the repository's secrets.h, prints its address, then:
;   python3 ../../wsbuf_race_check.py <ip> 120 3
;   pio run -e esp32dev -t upload --upload-port /dev/serial/by-id/<fragment>
[env]
framework = arduino
lib_archive = false
lib_ldf_mode = chain
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=3 -I../../../..
extra_scripts = ../../../../DomoticsCore-WebUI/embed_webui.py
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    symlink://../../../../DomoticsCore-Core
    symlink://../../../../DomoticsCore-WebUI

; /dev/ttyUSB0 is whichever board was plugged in first: override with
; --upload-port rather than editing this line.
[env:esp32dev]
platform = espressif32
board = esp32dev
upload_port = /dev/ttyUSB0
build_flags = ${env.build_flags} -std=gnu++14
build_unflags = -std=gnu++11
lib_deps =
    ${env.lib_deps}
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
lib_ignore = ESPAsyncTCP, RPAsyncTCP
