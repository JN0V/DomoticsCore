; Board probe: what a code-less alarm panel's discovery document says on the wire.
;
; The panel is configured the way the library's defaults describe one — no code,
; nothing required — with the two arm modes a real panel carries. Read the
; retained config off the broker and look for the key that says so:
;
;   uv run tools/on-device/mqtt_watch.py <broker> --for 20 \
;        --topic 'homeassistant/alarm_control_panel/+/+/config'
;
; Name the bench broker on the build line rather than in secrets.h:
;   PLATFORMIO_BUILD_FLAGS='-DDC_PANEL_BROKER=\"<broker>\"'
[env]
framework = arduino
lib_archive = false
lib_ldf_mode = chain
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=3 -I../../../..
lib_deps =
    symlink://../../../../DomoticsCore-Core
    symlink://../../../../DomoticsCore-LED
    symlink://../../../../DomoticsCore-RemoteConsole
    symlink://../../../../DomoticsCore-Wifi
    symlink://../../../../DomoticsCore-System
    symlink://../../../../DomoticsCore-MQTT
    symlink://../../../../DomoticsCore-HomeAssistant
    bblanchon/ArduinoJson@^7.0.4
    knolleary/PubSubClient@^2.8

; /dev/ttyUSB0 is whichever board was plugged in first, and there are three
; here: override with --upload-port rather than editing this line.
[env:esp32dev]
platform = espressif32
board = esp32dev
upload_port = /dev/ttyUSB0
build_flags = ${env.build_flags} -std=gnu++14
build_unflags = -std=gnu++11
