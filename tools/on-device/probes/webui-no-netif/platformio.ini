; Board probe: a component that opens a socket, started with no network
; interface — no WiFi component, the transport-neutral shape. After 8 s the
; probe creates the station interface itself, which is the moment a deferred
; server should open. PROBE_NTP=1 runs the NTP component alone instead.
;
; Flash and read the port; there is no test runner here.
;   pio run -e esp32dev -t upload --upload-port /dev/serial/by-id/<fragment>
[env]
framework = arduino
lib_archive = false
lib_ldf_mode = chain
monitor_speed = 115200
lib_deps =
    symlink://../../../../DomoticsCore-Core
    symlink://../../../../DomoticsCore-WebUI
    symlink://../../../../DomoticsCore-NTP

; /dev/ttyUSB0 is whichever board was plugged in first: override with
; --upload-port rather than editing this line.
[env:esp32dev]
platform = espressif32
board = esp32dev
upload_port = /dev/ttyUSB0
build_flags = -DCORE_DEBUG_LEVEL=3 -std=gnu++14
build_unflags = -std=gnu++11

[env:esp32dev_ntp]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DPROBE_NTP=1
