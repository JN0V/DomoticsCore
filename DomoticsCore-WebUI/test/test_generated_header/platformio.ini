; This suite reads the native manifests of the repository and never compiles
; a component, so it needs no dependency and no include path of its own. It is
; a project of its own because the WebUI component's native environment only
; runs the suites its test_filter names.
[env:native]
platform = native
test_framework = unity
test_build_src = false
lib_compat_mode = off
build_flags =
    -std=gnu++17
