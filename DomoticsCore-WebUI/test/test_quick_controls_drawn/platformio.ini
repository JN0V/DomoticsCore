[platformio]
; The component this project sits in is a symlink:// dependency elsewhere, so
; libdeps stays outside it, as the other projects of their own do.
libdeps_dir = ../../../.pio/libdeps/WebUI-test_quick_controls_drawn

; The page's front end (webui_src/app.js) is JavaScript, which no suite of the
; component's own environment reaches. This project reads it as text on the
; host, so the report names the check.
[env:native]
platform = native
test_framework = unity
test_build_src = false
lib_compat_mode = off
build_flags =
    -std=gnu++17
test_testing_command =
    env
    GLIBC_TUNABLES=glibc.malloc.tcache_count=0
    ${platformio.build_dir}/${this.__env__}/program
