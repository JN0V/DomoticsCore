[platformio]
; The components are symlink:// dependencies, built where they live. libdeps
; stays outside the component this project sits in, or that component claims
; every include under it (CI-15).
libdeps_dir = ../../../.pio/libdeps/WebUI-test_streaming_serializer

; Native test for streaming serializer JSON validation
; Runs on host machine to verify JSON output is valid

[env:native]
platform = native
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    symlink://../../
    symlink://../../../DomoticsCore-Core/
lib_archive = false
lib_ldf_mode = chain
build_flags =
    -std=c++17
    -DUNITY_INCLUDE_PRINT_FORMATTED
    -DARDUINOJSON_ENABLE_STD_STRING=1
    -DARDUINOJSON_ENABLE_STD_STREAM=0
    -DDOMOTICS_PLATFORM_UNKNOWN=1
    -I../../include
    -I../../../DomoticsCore-Core/include
build_unflags = -std=gnu++11
test_framework = unity
; glibc's tcache keeps freed blocks counted as allocated by mallinfo(), which
; HeapTracker reads: without this a heap assertion depends on the tests before it.
test_testing_command =
    env
    GLIBC_TUNABLES=glibc.malloc.tcache_count=0
    ${platformio.build_dir}/${this.__env__}/program
test_build_src = false
