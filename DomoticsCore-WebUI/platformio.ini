[env:native]
platform = native
test_framework = unity
test_build_src = true
lib_compat_mode = off
lib_ignore = ESPAsyncWebServer, AsyncTCP, ESP Async WebServer
; glibc's tcache keeps freed blocks counted as allocated by mallinfo(), which
; HeapTracker reads: without this a heap assertion depends on the tests before it.
test_testing_command =
    env
    GLIBC_TUNABLES=glibc.malloc.tcache_count=0
    ${platformio.build_dir}/${this.__env__}/program
; Only run tests designed for native (exclude hardware tests)
test_filter = test_webui_component, test_system_header, test_schema_chunking, test_update_builder, test_webui_server_gate, test_webui_component_toggle, test_webui_auth_delay
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -I../tests/mocks/libraries
    -I../DomoticsCore-Core/include
    -I../DomoticsCore-WebUI/include

lib_deps =
    symlink://../DomoticsCore-Core
    bblanchon/ArduinoJson@^7.0.0

[env:esp8266dev]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
test_framework = unity
test_filter = test_heap_esp8266
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    symlink://../DomoticsCore-Core
    ESP32Async/ESPAsyncTCP
    ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson@^7.0.0
