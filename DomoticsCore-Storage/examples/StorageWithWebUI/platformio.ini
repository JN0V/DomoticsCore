[platformio]
; The components are symlink:// dependencies, built where they live. libdeps
; stays outside the component this project sits in, or that component claims
; every include under it (CI-15).
libdeps_dir = ../../../.pio/libdeps/Storage-StorageWithWebUI

[env]
framework = arduino
lib_archive = false
lib_ldf_mode = chain
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=3
extra_scripts =
    pre:../../../DomoticsCore-WebUI/embed_webui.py

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags = ${env.build_flags} -std=gnu++14
build_unflags = -std=gnu++11
lib_deps =
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson@^7.0.4
    symlink://../../../DomoticsCore-Core
    symlink://../../../DomoticsCore-Wifi
    symlink://../../../DomoticsCore-Storage
    symlink://../../../DomoticsCore-WebUI
lib_ignore = ESPAsyncTCP, RPAsyncTCP
monitor_filters = esp32_exception_decoder

[env:esp8266dev]
platform = espressif8266
board = d1_mini
build_flags = ${env.build_flags} -std=gnu++17
lib_deps =
    ESP32Async/ESPAsyncTCP
    ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson@^7.0.4
    symlink://../../../DomoticsCore-Core
    symlink://../../../DomoticsCore-Wifi
    symlink://../../../DomoticsCore-Storage
    symlink://../../../DomoticsCore-WebUI
lib_ignore = AsyncTCP, RPAsyncTCP

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags = 
    ${env.build_flags} -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
lib_deps =
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson@^7.0.4
    symlink://../../../DomoticsCore-Core
    symlink://../../../DomoticsCore-Wifi
    symlink://../../../DomoticsCore-Storage
    symlink://../../../DomoticsCore-WebUI
lib_ignore = ESPAsyncTCP, RPAsyncTCP
