[env:native]
platform = native
test_framework = unity
test_build_src = true
lib_compat_mode = off
test_ignore = test_heap_esp8266
; StorageWebUI pulls the WebUI headers (IWebUIProvider etc.); the WebUI file://
; dependency declares the async server, absent on the host — ignore it.
lib_ignore = ESPAsyncWebServer, AsyncTCP, ESP Async WebServer
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -I../DomoticsCore-Core/include
    -I../DomoticsCore-Storage/include
    -I../DomoticsCore-WebUI/include

lib_deps =
    file://../DomoticsCore-Core
    file://../DomoticsCore-Storage
    file://../DomoticsCore-WebUI
    bblanchon/ArduinoJson@^7.0.0

[env:esp8266dev]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
test_framework = unity
test_filter = test_heap_esp8266
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    file://../DomoticsCore-Core
    file://../DomoticsCore-Storage
    bblanchon/ArduinoJson@^7.0.0
