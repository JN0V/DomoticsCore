[env:native]
platform = native
test_framework = unity
test_build_src = true
lib_compat_mode = off
test_ignore = test_heap_esp8266
; StorageWebUI pulls the WebUI headers (IWebUIProvider etc.); the WebUI symlink://
; dependency declares the async server, absent on the host — ignore it.
lib_ignore = ESPAsyncWebServer, AsyncTCP, ESP Async WebServer
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -I../DomoticsCore-Core/include
    -I../DomoticsCore-Storage/include
    -I../DomoticsCore-WebUI/include

lib_deps =
    symlink://../DomoticsCore-Core
    symlink://../DomoticsCore-WebUI
    bblanchon/ArduinoJson@^7.0.0

[env:esp8266dev]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
test_framework = unity
test_filter = test_heap_esp8266
; BUG-41: the shipped budget is 32 reference events (~28 KB), which a board
; reaches only with Home Assistant's connect burst. Lowered here so the plateau
; the suite exists to prove is reachable in forty writes instead of two hundred.
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DDOMOTICS_EVENTBUS_QUEUE_BYTES=4096

lib_deps =
    symlink://../DomoticsCore-Core
    bblanchon/ArduinoJson@^7.0.0
